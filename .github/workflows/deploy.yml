# Build and publish on pushes to main or a manual run, separately from CI.
# Azure steps remain disabled until hosting and rollout are configured.
name: Publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  # id-token: write # Enable with the Azure steps below.

# env:
#   APP: ${{ vars.AZURE_CONTAINERAPP }}
#   JOB: ${{ vars.AZURE_CONTAINERAPP }}-migrate
#   RG: ${{ vars.AZURE_RESOURCE_GROUP }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Name the image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/web:$GITHUB_SHA" >> "$GITHUB_ENV"

      # - uses: azure/login@v2
      #   with:
      #     client-id: ${{ vars.AZURE_CLIENT_ID }}
      #     tenant-id: ${{ vars.AZURE_TENANT_ID }}
      #     subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # - name: Check the migration job exists
      #   run: |
      #     : "${APP:?Set the AZURE_CONTAINERAPP repository variable}"
      #     : "${RG:?Set the AZURE_RESOURCE_GROUP repository variable}"
      #     az containerapp job show -n "$JOB" -g "$RG" -o none

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # - name: Migrate
      #   timeout-minutes: 10
      #   run: bash .github/scripts/migrate.sh

      # Revision creation and traffic switching belong to the rollout slice.

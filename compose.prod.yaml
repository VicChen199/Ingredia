name: ingredia-prod

services:
  web:
    image: ${APP_IMAGE:?Set APP_IMAGE to a tested GHCR commit tag}
    ports:
      # A reverse proxy on the VPS terminates HTTPS and forwards to this port.
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://ingredia:${POSTGRES_PASSWORD:?Set a URL-safe POSTGRES_PASSWORD}@db:5432/ingredia
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:?Set the Azure Storage connection string}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:?Set AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:?Set AUTH_GOOGLE_SECRET}
      AUTH_URL: ${AUTH_URL:?Set AUTH_URL to the public HTTPS origin}
      AUTH_TRUST_HOST: "true"
      PG_POOL_MAX: ${PG_POOL_MAX:-1}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrate:
    image: ${APP_IMAGE:?Set APP_IMAGE to a tested GHCR commit tag}
    command: [/app/apps/migrate/node_modules/.bin/tsx, /app/apps/migrate/src/index.ts]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ingredia:${POSTGRES_PASSWORD:?Set a URL-safe POSTGRES_PASSWORD}@db:5432/ingredia

  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ingredia
      POSTGRES_USER: ingredia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a URL-safe POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ingredia -d ingredia"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
